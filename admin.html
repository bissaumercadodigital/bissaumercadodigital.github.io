<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Admin - Mercado Digital Bissau</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #121926;
            --primary: #7c3aed;
            --orange: #ff6600;
            --orange-glow: rgba(255, 102, 0, 0.4);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --border: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; padding-bottom: 100px; }
        
        .header { text-align: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .header h1 { color: var(--orange); font-weight: 800; font-size: 1.5rem; }
        
        .admin-container { max-width: 800px; margin: 0 auto; }
        
        /* Card de Login */
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            max-width: 400px;
            margin: 50px auto 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .login-card h2 { font-size: 1.2rem; margin-bottom: 1rem; text-align: center; }

        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }

        .form-input:focus, .form-select:focus { border-color: var(--orange); }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--orange), #d95300);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* Dashboard & Tabs */
        #dashboardArea { display: none; }

        .top-admin-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.4);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Card de Registo Manual */
        .manual-add-card {
            background-color: var(--bg-card);
            border: 1px dashed var(--orange);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .manual-add-card h3 {
            font-size: 1rem;
            color: var(--orange);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .order-card {
            background-color: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .order-card.warning-expiring {
            border: 1px solid var(--orange);
            box-shadow: 0 0 15px var(--orange-glow);
        }

        .order-card.expired {
            border: 1px solid var(--danger);
        }
        
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); padding-bottom: 10px; margin-bottom: 10px; }
        .order-id { font-weight: 800; color: var(--primary); }
        .order-total { font-weight: 800; color: var(--success); font-size: 1.1rem; }
        
        .client-info p { margin-bottom: 5px; font-size: 0.9rem; }
        .highlight-data { background: rgba(255, 102, 0, 0.1); border: 1px solid var(--orange); padding: 5px 10px; border-radius: 6px; font-weight: 700; color: var(--orange); display: inline-block; margin-top: 5px; }
        
        .items-list { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 0.85rem; }
        
        .delivery-section { margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
        .delivery-input { width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 14px; margin-bottom: 10px; }
        
        .btn-approve { width: 100%; background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        .btn-whatsapp-remind { width: 100%; background: #25d366; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }

        .days-badge {
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid var(--primary);
            color: #a78bfa;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .days-badge.warning { background: rgba(255, 102, 0, 0.2); border-color: var(--orange); color: var(--orange); }
        .days-badge.danger { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: var(--danger); }
        
        #loadingMsg, #emptyMsg, #loadingMsgAssinaturas { text-align: center; color: var(--text-muted); margin-top: 50px; font-weight: 600; }
    </style>
</head>
<body>

    <!-- Tela de Login -->
    <div class="login-card" id="loginArea">
        <h2>🔒 Login de Administrador</h2>
        <input type="email" id="adminEmail" class="form-input" placeholder="E-mail do Administrador">
        <input type="password" id="adminPassword" class="form-input" placeholder="Sua Senha">
        <button onclick="fazerLogin()" class="btn-login">Entrar no Painel</button>
        <div id="loginError" class="error-msg">Acesso negado ou credenciais inválidas.</div>
    </div>

    <!-- Área de Gestão -->
    <div class="admin-container" id="dashboardArea">
        <div class="header">
            <h1>⚙️ Bissau Mercado Digital - ADMIN</h1>
            <p>Gestão de Pedidos e Assinaturas</p>
        </div>

        <div class="top-admin-bar">
            <span id="userLoggedEmail" style="font-size: 0.85rem; color: var(--text-muted);"></span>
            <button onclick="fazerLogout()" class="btn-logout">Sair / Logout</button>
        </div>

        <!-- Abas de Navegação -->
        <div class="admin-tabs">
            <button class="tab-btn active" id="tabPedidosBtn" onclick="trocarAba('pedidos')">📦 Pedidos Pendentes</button>
            <button class="tab-btn" id="tabAssinaturasBtn" onclick="trocarAba('assinaturas')">📺 Assinaturas Ativas</button>
        </div>

        <!-- Conteúdo dos Pedidos -->
        <div id="secPedidos">
            <div id="pedidosContainer">
                <div id="loadingMsg">A carregar pedidos...</div>
            </div>
        </div>

        <!-- Conteúdo das Assinaturas -->
        <div id="secAssinaturas" style="display: none;">
            
            <!-- Formulário de Registo Manual para Clientes do WhatsApp -->
            <div class="manual-add-card">
                <h3>➕ Registo Manual de Assinatura (Cliente WhatsApp)</h3>
                
                <div class="grid-2">
                    <input type="text" id="manualNome" class="form-input" placeholder="Nome do Cliente">
                    <input type="tel" id="manualTelefone" class="form-input" placeholder="WhatsApp (Ex: 245955288370)">
                </div>

                <div class="grid-2">
                    <input type="text" id="manualServico" class="form-input" placeholder="Serviço (Ex: Netflix 4K - 1 Tela)">
                    <input type="number" id="manualPreco" class="form-input" placeholder="Preço do Serviço (FCFA)">
                </div>

                <div class="grid-2">
                    <select id="manualValidade" class="form-select">
                        <option value="30">30 Dias (1 Mês)</option>
                        <option value="90">90 Dias (3 Meses)</option>
                        <option value="365">365 Dias (1 Ano)</option>
                        <option value="0">Vitalício / Sem Expiração</option>
                    </select>
                </div>

                <textarea id="manualDados" class="delivery-input" rows="2" placeholder="Dados de Acesso (Ex: Email: x@x.com, Senha: 123)"></textarea>

                <button class="btn-approve" onclick="registarAssinaturaManual()">⚡ Ativar Assinatura Manual e Adicionar ao Painel</button>
            </div>

            <div id="assinaturasContainer">
                <div id="loadingMsgAssinaturas">A carregar assinaturas...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, setDoc, getDoc, increment, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAk18pVSpBKX2kH6GtsNUXlIbfGPTLxKpo",
            authDomain: "mercado-digital-bissau.firebaseapp.com",
            projectId: "mercado-digital-bissau",
            storageBucket: "mercado-digital-bissau.firebasestorage.app",
            messagingSenderId: "171260734990",
            appId: "1:171260734990:web:130c33169923af3437165f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const EMAIL_ADMIN_OFICIAL = "mamudodjalo100@gmail.com";

        const loginArea = document.getElementById('loginArea');
        const dashboardArea = document.getElementById('dashboardArea');
        const containerPedidos = document.getElementById('pedidosContainer');
        const containerAssinaturas = document.getElementById('assinaturasContainer');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email.toLowerCase() === EMAIL_ADMIN_OFICIAL.toLowerCase()) {
                    loginArea.style.display = 'none';
                    dashboardArea.style.display = 'block';
                    document.getElementById('userLoggedEmail').innerText = 'Logado como: ' + user.email;
                    carregarPedidosPendentes();
                    carregarAssinaturas();
                } else {
                    alert("Acesso Negado! O e-mail " + user.email + " não tem permissões de administrador.");
                    signOut(auth);
                }
            } else {
                loginArea.style.display = 'block';
                dashboardArea.style.display = 'none';
            }
        });

        window.fazerLogin = async function() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            const errorMsg = document.getElementById('loginError');

            errorMsg.style.display = 'none';

            if (email.toLowerCase() !== EMAIL_ADMIN_OFICIAL.toLowerCase()) {
                errorMsg.innerText = "Apenas o e-mail administrador tem permissão de entrada.";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error(error);
                errorMsg.innerText = "E-mail ou senha incorretos!";
                errorMsg.style.display = 'block';
            }
        };

        window.fazerLogout = function() {
            signOut(auth);
        };

        window.trocarAba = function(aba) {
            const secPedidos = document.getElementById('secPedidos');
            const secAssinaturas = document.getElementById('secAssinaturas');
            const tabPedidosBtn = document.getElementById('tabPedidosBtn');
            const tabAssinaturasBtn = document.getElementById('tabAssinaturasBtn');

            if (aba === 'pedidos') {
                secPedidos.style.display = 'block';
                secAssinaturas.style.display = 'none';
                tabPedidosBtn.classList.add('active');
                tabAssinaturasBtn.classList.remove('active');
                carregarPedidosPendentes();
            } else {
                secPedidos.style.display = 'none';
                secAssinaturas.style.display = 'block';
                tabPedidosBtn.classList.remove('active');
                tabAssinaturasBtn.classList.add('active');
                carregarAssinaturas();
            }
        };

        async function carregarPedidosPendentes() {
            try {
                const q = query(collection(db, "pedidos"), where("status", "==", "Pendente"));
                const querySnapshot = await getDocs(q);
                
                containerPedidos.innerHTML = ''; 

                if (querySnapshot.empty) {
                    containerPedidos.innerHTML = '<div id="emptyMsg">✅ Não há pedidos pendentes no momento.</div>';
                    return;
                }

                querySnapshot.forEach((documento) => {
                    const pedido = documento.data();
                    const docId = documento.id;
                    
                    let itensHtml = '';
                    if (pedido.itens && Array.isArray(pedido.itens)) {
                        pedido.itens.forEach(item => {
                            itensHtml += `<div>- ${item.nome} (${item.opcao || ''}) | Qtd: ${item.quantidade || 1}</div>`;
                        });
                    }

                    let telefoneCliente = (pedido.clienteTelefone || '').replace(/\D/g, '');
                    if (telefoneCliente && !telefoneCliente.startsWith('245')) {
                        telefoneCliente = '245' + telefoneCliente;
                    }

                    const card = document.createElement('div');
                    card.className = 'order-card';
                    card.innerHTML = `
                        <div class="order-header">
                            <span class="order-id">${pedido.orderId || 'ORD-000000'}</span>
                            <span class="order-total">${(pedido.total || 0).toLocaleString()} FCFA</span>
                        </div>
                        <div class="client-info">
                            <p><strong>Cliente:</strong> ${pedido.clienteNome || 'Cliente'}</p>
                            <p><strong>WhatsApp:</strong> ${telefoneCliente}</p>
                            <p><strong>Verificar Depósito:</strong></p>
                            <span class="highlight-data">${pedido.comprovativoFornecido}</span>
                        </div>
                        
                        <div class="items-list">
                            <strong>Itens Solicitados:</strong><br>
                            ${itensHtml}
                        </div>

                        <div class="delivery-section">
                            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Duração / Validade do Serviço:</label>
                            <select id="validade-${docId}" class="form-select">
                                <option value="30">30 Dias (1 Mês)</option>
                                <option value="90">90 Dias (3 Meses)</option>
                                <option value="365">365 Dias (1 Ano)</option>
                                <option value="0">Vitalício / Sem Expiração</option>
                            </select>

                            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Dados de Entrega (Conta, Senha, PIN, etc.):</label>
                            <textarea id="dados-${docId}" class="delivery-input" rows="3" placeholder="Ex: Email: x@x.com, Senha: 123"></textarea>
                            <button class="btn-approve" onclick="aprovarPedido('${docId}', '${telefoneCliente}', '${pedido.orderId}', '${pedido.clienteNome}')">✅ Confirmar Pagamento e Ativar Serviço</button>
                        </div>
                    `;
                    containerPedidos.appendChild(card);
                });
            } catch (error) {
                console.error("Erro ao carregar pedidos: ", error);
                containerPedidos.innerHTML = '<div id="emptyMsg" style="color: var(--danger);">Erro ao conectar ao servidor.</div>';
            }
        }

        window.aprovarPedido = async function(docId, telefone, orderId, clienteNome) {
            const dadosEntrega = document.getElementById(`dados-${docId}`).value.trim();
            const diasValidade = parseInt(document.getElementById(`validade-${docId}`).value);
            
            if(dadosEntrega === '') {
                alert("Por favor, preencha os dados do produto/conta antes de aprovar.");
                return;
            }

            const confirmacao = confirm(`Tem certeza que verificou o depósito e deseja ativar este serviço por ${diasValidade === 0 ? 'tempo Vitalício' : diasValidade + ' dias'}?`);
            if(!confirmacao) return;

            try {
                const pedidoRef = doc(db, "pedidos", docId);
                const pedidoSnap = await getDoc(pedidoRef);
                const pedidoData = pedidoSnap.data();

                const dataInicio = new Date();
                let dataFim = null;

                if (diasValidade > 0) {
                    dataFim = new Date();
                    dataFim.setDate(dataFim.getDate() + diasValidade);
                }

                await updateDoc(pedidoRef, {
                    status: "Concluído",
                    dadosEntregues: dadosEntrega
                });

                const servicoNome = (pedidoData.itens && pedidoData.itens[0]) ? pedidoData.itens[0].nome : 'Assinatura Digital';
                const assinaturaRef = doc(collection(db, "assinaturas"));

                await setDoc(assinaturaRef, {
                    pedidoId: orderId,
                    userId: pedidoData.userId || null,
                    clienteNome: clienteNome,
                    clienteTelefone: telefone,
                    servicoNome: servicoNome,
                    dadosEntrega: dadosEntrega,
                    dataInicio: dataInicio.toISOString(),
                    dataFim: dataFim ? dataFim.toISOString() : null,
                    diasContratados: diasValidade,
                    status: "Ativa",
                    itemDetalhe: pedidoData.itens || []
                });

                if (pedidoData && pedidoData.userId) {
                    const compradorRef = doc(db, "usuarios", pedidoData.userId);
                    const compradorSnap = await getDoc(compradorRef);

                    if (compradorSnap.exists()) {
                        const compradorData = compradorSnap.data();
                        const convidadoPorUid = compradorData.convidadoPor;

                        if (convidadoPorUid) {
                            const valorTotal = pedidoData.total || 0;
                            const pontosComissao = Math.round(valorTotal * 0.01);

                            if (pontosComissao > 0) {
                                const inviterRef = doc(db, "usuarios", convidadoPorUid);
                                await updateDoc(inviterRef, {
                                    pontos: increment(pontosComissao)
                                });
                            }
                        }
                    }
                }

                const msg = `Olá *${clienteNome}*! A sua assinatura foi ativada com sucesso! 🎉\n\n*Serviço:* ${servicoNome}\n*Duração:* ${diasValidade === 0 ? 'Vitalício' : diasValidade + ' Dias'}\n*Seu Acesso:* \n${dadosEntrega}\n\nObrigado por comprar na Bissau Mercado Digital!`;
                const whatsappUrl = `https://wa.me/${telefone}?text=${encodeURIComponent(msg)}`;

                window.open(whatsappUrl, '_blank');
                carregarPedidosPendentes();
                carregarAssinaturas();

            } catch (error) {
                console.error("Erro ao aprovar pedido: ", error);
                alert("Erro ao aprovar pedido. Tente novamente.");
            }
        };

        window.registarAssinaturaManual = async function() {
            const nome = document.getElementById('manualNome').value.trim();
            let telefone = document.getElementById('manualTelefone').value.trim().replace(/\D/g, '');
            const servico = document.getElementById('manualServico').value.trim();
            const preco = parseFloat(document.getElementById('manualPreco').value) || 0;
            const diasValidade = parseInt(document.getElementById('manualValidade').value);
            const dados = document.getElementById('manualDados').value.trim();

            if (!nome || !telefone || !servico || !dados) {
                alert("Por favor, preencha todos os campos obrigatórios (Nome, Telefone, Serviço e Dados de Acesso).");
                return;
            }

            if (!telefone.startsWith('245')) {
                telefone = '245' + telefone;
            }

            try {
                const dataInicio = new Date();
                let dataFim = null;

                if (diasValidade > 0) {
                    dataFim = new Date();
                    dataFim.setDate(dataFim.getDate() + diasValidade);
                }

                const assinaturaRef = doc(collection(db, "assinaturas"));

                await setDoc(assinaturaRef, {
                    pedidoId: 'MANUAL-' + Math.floor(100000 + Math.random() * 900000),
                    userId: null,
                    clienteNome: nome,
                    clienteTelefone: telefone,
                    servicoNome: servico,
                    dadosEntrega: dados,
                    dataInicio: dataInicio.toISOString(),
                    dataFim: dataFim ? dataFim.toISOString() : null,
                    diasContratados: diasValidade,
                    status: "Ativa",
                    itemDetalhe: [{
                        nome: servico,
                        opcao: 'Registo Manual WhatsApp',
                        price: preco,
                        quantidade: 1
                    }]
                });

                alert("Assinatura manual ativada com sucesso!");
                
                document.getElementById('manualNome').value = '';
                document.getElementById('manualTelefone').value = '';
                document.getElementById('manualServico').value = '';
                document.getElementById('manualPreco').value = '';
                document.getElementById('manualDados').value = '';

                carregarAssinaturas();

            } catch (error) {
                console.error("Erro ao registar assinatura manual: ", error);
                alert("Erro ao registar assinatura manual. Tente novamente.");
            }
        };

        async function carregarAssinaturas() {
            try {
                const querySnapshot = await getDocs(collection(db, "assinaturas"));
                containerAssinaturas.innerHTML = '';

                if (querySnapshot.empty) {
                    containerAssinaturas.innerHTML = '<div id="emptyMsg">📺 Nenhuma assinatura registada de momento.</div>';
                    return;
                }

                const agora = new Date();

                querySnapshot.forEach((documento) => {
                    const ass = documento.data();
                    const assId = documento.id;

                    let diasRestantesText = "Vitalício";
                    let badgeClass = "";
                    let isExpiringSoon = false;

                    if (ass.dataFim) {
                        const dataFim = new Date(ass.dataFim);
                        const diffTime = dataFim - agora;
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                        if (diffDays <= 0) {
                            diasRestantesText = "EXPIRADO";
                            badgeClass = "danger";
                            isExpiringSoon = true;
                        } else {
                            diasRestantesText = `${diffDays} Dia(s) Restantes`;
                            if (diffDays <= 3) {
                                badgeClass = "warning";
                                isExpiringSoon = true;
                            }
                        }
                    }

                    const card = document.createElement('div');
                    card.className = `order-card ${badgeClass === 'warning' ? 'warning-expiring' : (badgeClass === 'danger' ? 'expired' : '')}`;
                    
                    const linkRenovacao = `https://bissaumercadodigital.github.io/renovacao.html?id=${assId}`;
                    const mensagemWhatsApp = `Olá *${ass.clienteNome}*! A sua assinatura do *${ass.servicoNome}* está prestes a expirar (${diasRestantesText}).\n\nPara renovar sem perder os seus dados de acesso, clique no link oficial de renovação:\n${linkRenovacao}`;

                    card.innerHTML = `
                        <div class="order-header">
                            <span class="order-id">${ass.servicoNome}</span>
                            <span class="days-badge ${badgeClass}">${diasRestantesText}</span>
                        </div>
                        <div class="client-info">
                            <p><strong>Cliente:</strong> ${ass.clienteNome}</p>
                            <p><strong>WhatsApp:</strong> ${ass.clienteTelefone}</p>
                            <p><strong>Início:</strong> ${new Date(ass.dataInicio).toLocaleDateString('pt-PT')}</p>
                            <p><strong>Fim:</strong> ${ass.dataFim ? new Date(ass.dataFim).toLocaleDateString('pt-PT') : 'Vitalício'}</p>
                        </div>
                        <div class="items-list">
                            <strong>Acesso do Cliente:</strong><br>
                            ${ass.dadosEntrega}
                        </div>
                        ${isExpiringSoon ? `
                            <button class="btn-whatsapp-remind" onclick="window.open('https://wa.me/${ass.clienteTelefone}?text=${encodeURIComponent(mensagemWhatsApp)}', '_blank')">
                                🔔 Lembrar Cliente no WhatsApp
                            </button>
                        ` : ''}
                    `;
                    containerAssinaturas.appendChild(card);
                });

            } catch (error) {
                console.error("Erro ao carregar assinaturas: ", error);
                containerAssinaturas.innerHTML = '<div id="emptyMsg" style="color: var(--danger);">Erro ao carregar assinaturas.</div>';
            }
        }
    </script>
</body>
</html>
